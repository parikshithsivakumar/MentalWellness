<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.com"
	th:fragment="layout(content)">
<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
	integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>Wellnest</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/dashboard.css}">
<link rel="stylesheet" th:href="@{/css/breathbox.css}">
<link rel="stylesheet" th:href="@{/css/timer.css}">
<link rel="stylesheet" th:href="@{/css/notes.css}">
<link rel="stylesheet" th:href="@{/css/addnotes.css}">
<link rel="stylesheet" th:href="@{/css/questionnaire.css}">
<link rel="stylesheet" th:href="@{/css/profile.css}">
<link rel="stylesheet" th:href="@{/css/results.css}">
<link rel="stylesheet" th:href="@{/css/wordle.css}">
<style type="text/css">
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}

	html, body {
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
		background-color: #f0f8ff;
	}

	.paint-card {
		box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
		border: none;
	}

	/* Modern Header */
	.navbar-top {
		background-color: white;
		padding: 14px 0;
		box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
		border-bottom: 1px solid #e5e7eb;
	}

	.navbar-brand-modern {
		display: flex;
		align-items: center;
		gap: 12px;
		font-weight: 700;
		font-size: 20px;
		color: #1f2937;
		text-decoration: none;
	}

	.navbar-brand-modern img {
		width: 40px;
		height: 40px;
		border-radius: 8px;
	}

	.navbar-brand-modern:hover {
		color: #1f2937;
		text-decoration: none;
	}

	.nav-items {
		display: flex;
		gap: 8px;
		align-items: center;
		flex: 1;
		margin-left: 40px;
	}

	.nav-link-modern {
		padding: 8px 16px;
		border-radius: 6px;
		color: #6b7280;
		text-decoration: none;
		font-size: 14px;
		font-weight: 500;
		transition: all 0.3s ease;
		display: flex;
		align-items: center;
		gap: 6px;
	}

	.nav-link-modern:hover,
	.nav-link-modern.active {
		color: #3b82f6;
		background-color: #dbeafe;
	}

	.nav-spacer {
		flex: 1;
	}

	.header-actions {
		display: flex;
		gap: 12px;
		align-items: center;
	}

	.btn-dark-mode {
		background: none;
		border: none;
		color: #6b7280;
		font-size: 18px;
		cursor: pointer;
		transition: color 0.3s ease;
		padding: 4px;
	}

	.btn-dark-mode:hover {
		color: #1f2937;
	}

	.btn-logout {
		background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
		color: white;
		border: none;
		padding: 8px 14px;
		border-radius: 6px;
		font-size: 13px;
		font-weight: 600;
		cursor: pointer;
		transition: all 0.3s ease;
		display: flex;
		align-items: center;
		gap: 6px;
		text-decoration: none;
	}

	.btn-logout:hover {
		transform: translateY(-2px);
		box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
		color: white;
	}

	@media (max-width: 768px) {
		.nav-items {
			margin-left: 0;
			gap: 4px;
		}

		.nav-link-modern {
			padding: 6px 12px;
			font-size: 13px;
		}

		.header-actions {
			gap: 8px;
		}
	}
</style>
</head>
<body>

	<!-- Modern Header -->
	<nav class="navbar-top">
		<div class="container-fluid" style="max-width: 100%; padding: 0 24px;">
			<div style="display: flex; align-items: center; justify-content: space-between;">
				<a class="navbar-brand-modern" th:href="@{/user/main}">
					<img src="../img/icon.jpg" alt="WellNest">
					<span>WellNest</span>
				</a>

				<div class="nav-items">
					<a th:href="@{/user/main}" class="nav-link-modern" id="nav-dashboard">
						<i class="fas fa-chart-line"></i>
						<span>Dashboard</span>
					</a>
					<a th:href="@{/user/viewNotes/0}" class="nav-link-modern" id="nav-notes">
						<i class="fas fa-note-sticky"></i>
						<span>Notes</span>
					</a>
					<a th:href="@{/user/questionnaire}" class="nav-link-modern" id="nav-questionnaire">
						<i class="fas fa-clipboard-list"></i>
						<span>Questionnaire</span>
					</a>
					<a th:href="@{/user/viewProfile}" class="nav-link-modern" id="nav-profile">
						<i class="fas fa-user"></i>
						<span>Profile</span>
					</a>
				</div>

				<div class="nav-spacer"></div>

				<div class="header-actions">
					<button class="btn-dark-mode" title="Dark Mode" onclick="toggleDarkMode()">
						<i class="fas fa-moon"></i>
					</button>
					<a th:href="@{/logout}" class="btn-logout">
						<i class="fas fa-sign-out-alt"></i>
						<span>Logout</span>
					</a>
				</div>
			</div>
		</div>
	</nav>

	<!-- Main Content -->
	<div th:replace="${content}"></div>

	<!-- Optional JavaScript -->
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
		integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
		crossorigin="anonymous"></script>
	
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
		integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
		crossorigin="anonymous"></script>
	
	<script
		src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
		integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
		crossorigin="anonymous">
	</script>

	<script>
		function toggleDarkMode() {
			// Placeholder for dark mode implementation
			alert('Dark mode coming soon');
		}

		// Set active nav item based on current page
		document.addEventListener('DOMContentLoaded', function() {
			const currentPath = window.location.pathname;
			const navLinks = document.querySelectorAll('.nav-link-modern');
			navLinks.forEach(link => {
				if (currentPath.includes(link.getAttribute('href').substring(1))) {
					link.classList.add('active');
				}
			});
		});
	</script>

</body>
</html>
