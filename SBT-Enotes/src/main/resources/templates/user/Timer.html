<!DOCTYPE html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="user/base::layout(~{::section})"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meditation Timer</title>
  </head>
  <body>
    <section>
      <div class="timer-container">
        <div class="timer-card">
          <h1 class="timer-title">Meditation Timer</h1>

          <div class="timer-display">
            <div class="timer-text" id="timer">00:00</div>
          </div>

          <p class="timer-prompt">Set your meditation duration</p>

          <div class="timer-input-group">
            <div>
              <label class="timer-label">Minutes</label>
              <input type="number" id="minutes" class="timer-input" min="0" max="59" value="5" placeholder="0">
            </div>
            <div>
              <label class="timer-label">Seconds</label>
              <input type="number" id="seconds" class="timer-input" min="0" max="59" value="0" placeholder="0">
            </div>
          </div>

          <button class="btn-start" id="startBtn" onclick="startCustomTimer()">
            <i class="fas fa-play"></i> 
            <span>Start Meditation</span>
          </button>

          <div class="timer-actions">
            <button class="btn-control" id="pauseBtn" onclick="pauseTimer()" style="display:none;">
              <i class="fas fa-pause"></i> Pause
            </button>
            <button class="btn-control" id="resumeBtn" onclick="resumeTimer()" style="display:none;">
              <i class="fas fa-play"></i> Resume
            </button>
            <button class="btn-control" id="stopBtn" onclick="stopTimer()" style="display:none;">
              <i class="fas fa-stop"></i> Stop
            </button>
          </div>
        </div>
      </div>

      <audio id="ringSound" th:src="@{/ring.mp3}" type="audio/mp3"></audio>
      <script th:src="@{/js/timer.js}"></script>
    </section>
  </body>
</html>
