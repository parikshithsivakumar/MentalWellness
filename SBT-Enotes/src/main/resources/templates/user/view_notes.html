<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="user/base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>Notes</title>
</head>
<body>
	<section>
		<div class="notes-container">
			<div class="notes-header">
				<h1 class="notes-title">Notes</h1>
				<a th:href="@{/user/addNotes}" class="btn-add-note">
					<i class="fas fa-plus"></i>
					<span>Add Note</span>
				</a>
			</div>

			<!-- Alert Message -->
			<div th:if="${session.msg}" class="alert-box">
				<th:block th:text="${session.msg}"></th:block>
				<th:block th:text="${#session.removeAttribute('msg')}"></th:block>
			</div>

			<!-- Search Bar -->
			<div class="search-bar">
				<input type="text" class="search-input" placeholder="Search title, content, tags..." id="noteSearch">
			</div>

			<!-- Notes Grid -->
		<div class="notes-grid" th:if="${!Notes.isEmpty()}">
			<div class="note-card" th:each="n:${Notes}">
					<h5 class="note-title" th:text="${n.title}"></h5>
					<p class="note-content" th:text="${n.content}"></p>
					<div class="note-actions">
						<a th:href="@{'/user/editNotes/'+${n.id}}" class="btn-action btn-edit">
							<i class="fas fa-edit"></i>
							<span>Edit</span>
						</a>
						<a th:href="@{'/user/deleteNotes/'+${n.id}}" class="btn-action btn-delete" onclick="return confirm('Are you sure?')">
							<i class="fas fa-trash"></i>
							<span>Delete</span>
						</a>
					</div>
				</div>
			</div>

			<!-- Empty State -->
		<div th:if="${Notes.isEmpty()}" class="empty-state">
				<div class="empty-state-icon">
					<i class="fas fa-sticky-note"></i>
				</div>
				<p class="empty-state-text">No notes yet. Create your first note to get started!</p>
			</div>

			<!-- Pagination -->
			<div class="pagination-container" th:if="${totalPage > 1}">
				<a th:if="${pageNo > 0}" th:href="@{'/user/viewNotes/' + ${pageNo-1}}" class="pagination-btn">
					<i class="fas fa-chevron-left"></i>
				</a>

				<a th:each="i:${#numbers.sequence(1,totalPage)}" 
					th:href="@{'/user/viewNotes/' + ${i-1}}"
					th:classappend="${pageNo+1==i} ? 'active' : ''"
					class="pagination-btn"
					th:text="${i}"></a>

				<a th:if="${pageNo+1 < totalPage}" th:href="@{'/user/viewNotes/' + ${pageNo+1}}" class="pagination-btn">
					<i class="fas fa-chevron-right"></i>
				</a>
			</div>
		</div>
	</section>

	<script>
		// Note search functionality
		document.getElementById('noteSearch').addEventListener('keyup', function(e) {
			const searchTerm = e.target.value.toLowerCase();
			document.querySelectorAll('.note-card').forEach(card => {
				const title = card.querySelector('.note-title').textContent.toLowerCase();
				const content = card.querySelector('.note-content').textContent.toLowerCase();
				card.style.display = (title.includes(searchTerm) || content.includes(searchTerm)) ? 'block' : 'none';
			});
		});
	</script>
</body>
</html>
