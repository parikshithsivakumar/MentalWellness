<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="user/base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>Profile</title>
</head>
<body>
	<section>
		<div class="profile-container">
			<h1 class="profile-title">Profile</h1>

			<div class="profile-grid">
				<!-- Left Column - View Profile -->
				<div class="profile-card">
					<h3 class="profile-section-title">Profile Information</h3>

					<div class="profile-info">
					<div class="profile-avatar">
						<span th:text="${user.name.substring(0, 1).toUpperCase()}"></span>
					</div>
							<h3 th:text="${user.name}"></h3>
							<p th:text="${user.email}"></p>
						</div>
					</div>

					<div class="form-group">
						<label class="form-label">Full Name</label>
						<input type="text" class="form-control" th:value="${user.name}" disabled>
					</div>

					<div class="form-group">
						<label class="form-label">Email Address</label>
						<input type="email" class="form-control" th:value="${user.email}" disabled>
					</div>

					<div class="form-group">
						<label class="form-label">About You</label>
						<textarea class="form-control" disabled>[[${user.about}]]</textarea>
					</div>
				</div>

				<!-- Right Column - Edit Profile & Stats -->
				<div>
					<div class="profile-card">
						<h3 class="profile-section-title">Edit Profile</h3>

						<!-- Alert Message -->
						<div th:if="${session.msg}" class="alert-success">
							<th:block th:text="${session.msg}"></th:block>
							<th:block th:text="${#session.removeAttribute('msg')}"></th:block>
						</div>

						<form th:action="@{/user/updateUser}" method="post">
							<div class="form-group">
								<label for="name" class="form-label">Full Name</label>
								<input type="text" id="name" name="name" class="form-control" th:value="${user.name}" required>
							</div>

							<div class="form-group">
								<label for="email" class="form-label">Email Address</label>
								<input type="email" id="email" name="email" class="form-control" th:value="${user.email}" disabled>
							</div>

							<div class="form-group">
								<label for="about" class="form-label">About You</label>
								<textarea id="about" name="about" class="form-control" placeholder="Tell us about yourself...">[[${user.about}]]</textarea>
							</div>

							<input type="hidden" name="id" th:value="${user.id}">

							<div class="form-actions">
								<button type="submit" class="btn-primary">
									<i class="fas fa-save"></i>
									<span>Save Changes</span>
								</button>
								<button type="reset" class="btn-secondary">
									<i class="fas fa-redo"></i>
									<span>Reset</span>
								</button>
							</div>
						</form>
					</div>

					<!-- Stats Card -->
					<div class="profile-card" style="margin-top: 32px;">
						<h3 class="profile-section-title" style="margin-bottom: 16px;">Your Stats</h3>

						<div class="stats-grid">
							<div class="stat-item">
								<div class="stat-label">Notes Count</div>
								<div class="stat-value" th:text="${noteCount}">0</div>
							</div>
							<div class="stat-item">
								<div class="stat-label">Wellness Score</div>
								<div class="stat-value" th:text="${wellnessScore} + '/100'">0/100</div>
							</div>
						</div>

						<div class="status-message">
							<i class="fas fa-chart-line" style="margin-right: 8px;"></i>
							<span th:if="${wellnessScore == 0}">Complete a wellness assessment to track your score!</span>
							<span th:if="${wellnessScore > 0}">Keep building your routine</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
