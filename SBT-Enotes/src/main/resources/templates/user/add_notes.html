<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="user/base::layout(~{::section})">
<head>
<meta charset="ISO-8859-1">
<title>Add Notes</title>
</head>
<body>
	<section>
		<div class="add-note-container">
			<div class="add-note-header">
				<h1 class="add-note-title">New Note</h1>
				<p class="add-note-subtitle">Write your thoughts and reflections below</p>
			</div>

			<form th:action="@{/user/saveNotes}" method="post" class="form-card">
				<!-- Alert Message -->
				<div th:if="${session.msg}" class="alert-success">
					<th:block th:text="${session.msg}"></th:block>
					<th:block th:text="${#session.removeAttribute('msg')}"></th:block>
				</div>

				<!-- Title -->
				<div class="form-group">
					<label for="title" class="form-label">Note Title</label>
					<input 
						type="text"
						id="title"
						name="title"
						class="form-control"
						placeholder="What's on your mind?"
						required>
				</div>

				<!-- Content -->
				<div class="form-group">
					<label for="content" class="form-label">Description</label>
					<textarea
						id="content"
						name="content"
						class="form-control"
						placeholder="Write your thoughts, feelings, and reflections here..."
						required></textarea>
				</div>

				<!-- Actions -->
				<div class="form-actions">
					<button type="submit" class="btn-submit">
						<i class="fas fa-save"></i>
						<span>Save Note</span>
					</button>
					<a th:href="@{/user/viewNotes/0}" class="btn-cancel">
						<i class="fas fa-arrow-left"></i>
						<span>Cancel</span>
					</a>
				</div>
			</form>
		</div>
	</section>
</body>
</html>
