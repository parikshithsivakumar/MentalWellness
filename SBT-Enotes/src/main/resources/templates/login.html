<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mental Wellness - Login</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			height: 100%;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			background: linear-gradient(135deg, #cfe7f3 0%, #d4f1d4 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 20px;
		}

		.login-container {
			width: 100%;
			max-width: 450px;
			background: white;
			border-radius: 16px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
			padding: 48px 40px;
			animation: slideUp 0.5s ease-out;
		}

		@keyframes slideUp {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.form-header {
			text-align: center;
			margin-bottom: 32px;
		}

		.form-title {
			font-size: 28px;
			font-weight: 700;
			color: #1f2937;
			margin-bottom: 8px;
			letter-spacing: -0.5px;
		}

		.form-subtitle {
			font-size: 15px;
			color: #6b7280;
			font-weight: 400;
		}

		/* Alerts */
		.alert {
			padding: 12px 14px;
			border-radius: 8px;
			margin-bottom: 20px;
			font-size: 13px;
			font-weight: 500;
			animation: slideDown 0.3s ease-out;
			border-left: 4px solid;
		}

		@keyframes slideDown {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.alert-danger {
			background-color: #fee2e2;
			color: #7f1d1d;
			border-left-color: #dc2626;
		}

		.alert-success {
			background-color: #dcfce7;
			color: #065f46;
			border-left-color: #10b981;
		}

		/* Form Elements */
		.form-group {
			margin-bottom: 20px;
		}

		.form-label {
			display: block;
			font-size: 13px;
			font-weight: 600;
			color: #1f2937;
			margin-bottom: 6px;
		}

		.input-group {
			position: relative;
			display: flex;
			align-items: center;
		}

		.form-control {
			width: 100%;
			padding: 11px 14px;
			padding-left: 38px;
			font-size: 14px;
			border: 1.5px solid #e5e7eb;
			border-radius: 8px;
			background: #f9fafb;
			color: #1f2937;
			transition: all 0.3s ease;
			font-family: inherit;
		}

		.form-control::placeholder {
			color: #9ca3af;
		}

		.form-control:focus {
			outline: none;
			border-color: #3b82f6;
			background: white;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
		}

		.input-icon {
			position: absolute;
			left: 12px;
			font-size: 16px;
			color: #9ca3af;
			pointer-events: none;
		}

		.password-toggle {
			position: absolute;
			right: 12px;
			background: none;
			border: none;
			font-size: 16px;
			cursor: pointer;
			color: #9ca3af;
			padding: 4px;
			transition: color 0.2s ease;
		}

		.password-toggle:hover {
			color: #6b7280;
		}

		/* Buttons */
		.btn-submit {
			width: 100%;
			padding: 13px 20px;
			font-size: 15px;
			font-weight: 700;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.3s ease;
			background: linear-gradient(135deg, #2563eb 0%, #10b981 100%);
			color: white;
			margin-top: 4px;
			margin-bottom: 16px;
		}

		.btn-submit:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
		}

		.btn-submit:active {
			transform: translateY(0);
		}

		.btn-submit:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		/* Sign Up Link */
		.signup-link {
			text-align: center;
			font-size: 14px;
			color: #6b7280;
		}

		.signup-link a {
			color: #3b82f6;
			text-decoration: none;
			font-weight: 600;
			transition: color 0.2s ease;
		}

		.signup-link a:hover {
			color: #2563eb;
			text-decoration: underline;
		}

		/* Responsive Design */
		@media (max-width: 480px) {
			.login-container {
				padding: 32px 24px;
			}

			.form-title {
				font-size: 24px;
			}

			.form-subtitle {
				font-size: 14px;
			}

			.form-control {
				padding: 10px 12px;
				padding-left: 34px;
				font-size: 13px;
			}

			.btn-submit {
				padding: 12px 16px;
				font-size: 14px;
			}
		}

		@media (max-width: 360px) {
			.login-container {
				padding: 24px 20px;
			}

			.form-header {
				margin-bottom: 24px;
			}

			.form-title {
				font-size: 20px;
			}

			.form-label {
				font-size: 12px;
			}

			.form-control {
				padding: 9px 11px;
				padding-left: 32px;
				font-size: 13px;
			}
		}
	</style>
</head>
<body>
	<div class="login-container">
		<div class="form-header">
			<h1 class="form-title">Welcome back</h1>
			<p class="form-subtitle">Sign in to continue your wellness journey.</p>
		</div>

		<form class="form-signin" method="post" th:action="@{/login}">
			<!-- Error Alert -->
			<div th:if="${param.error}" class="alert alert-danger" role="alert">
				<strong>Login Failed</strong> — Invalid email or password. Please try again.
			</div>

			<!-- Logout Success Alert -->
			<div th:if="${param.logout}" class="alert alert-success" role="alert">
				<strong>Logged Out Successfully</strong> — See you again soon!
			</div>

			<!-- Email Input -->
			<div class="form-group">
				<label for="username" class="form-label">Email</label>
				<div class="input-group">
					<span class="input-icon">✉️</span>
					<input 
						type="email" 
						id="username"
						name="username" 
						class="form-control" 
						placeholder="your@email.com" 
						required 
						autofocus
						aria-label="Email Address">
				</div>
			</div>

			<!-- Password Input -->
			<div class="form-group">
				<label for="password" class="form-label">Password</label>
				<div class="input-group">
					<span class="input-icon">🔒</span>
					<input 
						type="password" 
						id="password"
						name="password" 
						class="form-control" 
						placeholder="Enter your password" 
						required
						aria-label="Password">
					<button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">👁️</button>
				</div>
			</div>

			<!-- Submit Button -->
			<button 
				class="btn-submit" 
				type="submit"
				aria-label="Sign in to your account">
				➜ Sign in
			</button>

			<!-- Sign Up Link -->
			<div class="signup-link">
				No account? <a href="/signup">Register →</a>
			</div>
		</form>
	</div>

	<script>
		function togglePassword() {
			const passwordField = document.getElementById('password');
			const toggleBtn = document.querySelector('.password-toggle');
			
			if (passwordField.type === 'password') {
				passwordField.type = 'text';
				toggleBtn.textContent = '🙈';
			} else {
				passwordField.type = 'password';
				toggleBtn.textContent = '👁️';
			}
		}
	</script>
</body>
</html>
