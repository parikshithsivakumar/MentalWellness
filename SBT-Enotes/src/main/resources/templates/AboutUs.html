<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Us - Mental Wellness Website</title>
  <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
  <style>
    /* Additional inline styles */
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #2d3748; /* Background color for the entire page */
    }
    .main_about {
      background-color: #2d3748;
      color: #ffffff; /* Text color for the main about section */
      text-align: center;
      padding: 20px;
    }
    .about {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .main_heading {
      font-size: 2.8rem;
      margin-bottom: 20px;
    }
    .images-content {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .left-image,
    .right-image {
      width: 150px;
      height: auto;
      margin: 10px;
      border-radius: 50%;
    }
    .text-content {
      flex: 1;
      padding: 0 20px;
      text-align: left;
      color: #2d3748; /* Text color for the about content */
    }
  </style>
</head>
<body>


</body>
</html>
